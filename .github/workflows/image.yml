# PRIVATE build: adds Apple's macOS installer to the payload and produces the
# bootable USB image. Runs only in a private repository, because the image
# contains Apple software that must not be published.
name: image

on:
  workflow_dispatch:
    inputs:
      payload_repo:
        description: Public repo with the payload-latest release
        default: kaminofilms/surfacetouchmac

permissions:
  contents: write

jobs:
  image:
    if: github.event.repository.private == true
    runs-on: macos-15
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail -c "mkdir -p $RUNNER_TEMP/ci-logs; exec > >(tee -a $RUNNER_TEMP/ci-logs/image-build.log) 2>&1; echo \"### step $GITHUB_ACTION\"; source {0}"
    steps:
      # Build scripts come from the public repo; this private repo only needs
      # this workflow file.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.payload_repo }}
      - name: Free disk space
        run: |
          df -h /
          for x in /Applications/Xcode_*.app; do [ "$x" != "$(xcode-select -p | sed 's|/Contents/Developer||')" ] && sudo rm -rf "$x" & done; wait
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /Users/runner/hostedtoolcache || true
          df -h /
      - name: Payload
        run: |
          gh release download payload-latest -R "${{ inputs.payload_repo }}" -p 'SurfaceTouchMac-payload.zip*'
          shasum -a 256 -c SurfaceTouchMac-payload.zip.sha256
          ditto -x -k SurfaceTouchMac-payload.zip .
          ( cd payload && shasum -a 256 -c SHA256SUMS.txt )
      - name: Build image (Apple installer + OpenCore + setup package)
        run: PAYLOAD_DIR="$PWD/payload" bash image/build_image.sh
      - name: Join scripts + docs
        run: |
          cp docs/JOIN-AND-FLASH.md image/out/
          cp image/join/* image/out/
          cp payload/logs/* image/out/ 2>/dev/null || true
      - name: Private release
        run: |
          TAG="image-$(python3 -c 'import json;print(json.load(open("image/out/image-info.json"))["macos_version"])')-${GITHUB_RUN_NUMBER}"
          # -R: publish to THIS private repo, never the public one checked out above
          gh release create "$TAG" -R "${{ github.repository }}" --title "$TAG" --prerelease \
            --notes "Private: contains Apple macOS. Do not redistribute. See JOIN-AND-FLASH.md." \
            image/out/*
          echo "release: $TAG"
      - name: Push CI logs to this private repo's ci-logs branch
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ci-logs"
          cp "$GITHUB_WORKSPACE"/image/out/*.log "$GITHUB_WORKSPACE"/image/out/*.json "$GITHUB_WORKSPACE"/image/out/SHA256SUMS* . 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

# Public build: everything that is open source (no Apple software).
# Produces the "payload" release used by the private image build.
name: payload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kernel multitouch processor tests (ASan/UBSan, fuzz)
        run: make -C kext/tests test kernel-check CXX=clang++
      - name: EFI checker tests
        run: python3 -I efi/test_check_efi.py
      - name: Patch applies to pinned upstream
        run: |
          source versions.env
          git clone -q https://github.com/Xiashangning/BigSurfaceHIDDriver.git /tmp/hid
          git -C /tmp/hid checkout -q "$BIGSURFACEHID_COMMIT"
          git -C /tmp/hid apply "$PWD/kext/patches/0001-BigSurfaceHIDDriver-kernel-multitouch.patch"
          git -C /tmp/hid apply --check "$PWD/kext/patches/0002-SurfaceTouchscreen-ipad-style-gestures.patch"
          echo "patch applies cleanly"
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh') setup/scripts/preinstall setup/scripts/postinstall setup/*/postinstall setup/common/stm-local-sign; do bash -n "$f" && echo "ok $f"; done

  macos-build:
    # Native Intel runner = same CPU architecture as the Surface Pro 7
    runs-on: macos-15-intel
    needs: host-tests
    defaults:
      run:
        # every step's output is also kept in ci-logs/ (pushed to the ci-logs branch)
        shell: bash --noprofile --norc -eo pipefail -c "mkdir -p $GITHUB_WORKSPACE/ci-logs; exec > >(tee -a $GITHUB_WORKSPACE/ci-logs/macos-build.log) 2>&1; echo \"### step $GITHUB_ACTION\"; source {0}"
    env:
      GH_TOKEN: ${{ github.token }}
      STM_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version; swift --version
          echo "Rosetta not needed: native x86_64 runner"
      - name: Base EFI (fetch + versions)
        run: bash efi/build_efi.sh fetch
      - name: Build BigSurface.kext with kernel multitouch
        run: |
          source efi/build/stage.env
          export LILU_VER VSMC_VER
          bash kext/build_bigsurface.sh
      - name: Build AirportItlwm for Tahoe (laobamac/itlwm)
        run: bash kext/build_itlwm.sh
      - name: Assemble + validate EFI (ocvalidate, check_efi)
        run: bash efi/build_efi.sh assemble
      - name: Keyboard + setup tool unit tests
        working-directory: keyboard
        run: swift test 2>&1 | tee dist-tests.log
      - name: Build keyboard app and stm-setup (x86_64 + arm64, ad-hoc signed)
        run: bash keyboard/build.sh
      - name: Keyboard runtime checks
        run: bash keyboard/ci/keyboard-ci.sh
      - name: Pen helper (IPTSDaemon)
        continue-on-error: true
        run: bash iptsd/build_iptsd.sh
      - name: Installer package
        run: bash setup/build_pkg.sh
      - name: Local signing keeps the keyboard's identity stable across builds
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/stmsign"; A1="$RUNNER_TEMP/b1/SurfaceTouchKeys.app"; A2="$RUNNER_TEMP/b2/SurfaceTouchKeys.app"
          mkdir -p "$RUNNER_TEMP/b1" "$RUNNER_TEMP/b2"
          ditto keyboard/dist/SurfaceTouchKeys.app "$A1"; ditto keyboard/dist/SurfaceTouchKeys.app "$A2"
          # make the second copy look like a different build
          plutil -replace CFBundleVersion -string 999999 "$A2/Contents/Info.plist"
          sudo env STM_SIGN_DIR="$D" bash setup/common/stm-local-sign "$A1"
          sudo env STM_SIGN_DIR="$D" bash setup/common/stm-local-sign "$A2"
          r1="$(codesign -d -r- "$A1" 2>&1 | grep designated)"; r2="$(codesign -d -r- "$A2" 2>&1 | grep designated)"
          echo "build 1: $r1"; echo "build 2: $r2"
          req="${r1#designated => }"
          ok=1
          grep -q "certificate leaf" <<<"$r1" || { echo "CHECK local_sign_identity FAIL (not signed with the local key)"; ok=0; }
          codesign --verify --strict -R="$req" "$A2" && echo "CHECK local_sign_same_identity PASS" || { echo "CHECK local_sign_same_identity FAIL"; ok=0; }
          "$A2/Contents/MacOS/SurfaceTouchKeys" --version && echo "CHECK local_signed_app_runs PASS" || { echo "CHECK local_signed_app_runs FAIL"; ok=0; }
          sudo ls -l "$D"
          test $ok -eq 1
      - name: stm-setup refuses on non-Surface hardware (safety check on the runner)
        run: |
          set +e
          keyboard/dist/stm-setup check-hardware; rc=$?
          echo "exit=$rc"
          test "$rc" -eq 2
          keyboard/dist/stm-setup install-efi --source efi/build --dry-run; rc=$?
          echo "exit=$rc"
          test "$rc" -eq 2
          keyboard/dist/stm-setup update-kext --source kext/build; rc=$?
          echo "exit=$rc"
          test "$rc" -eq 2
      - name: Collect payload
        run: |
          P=payload
          rm -rf $P && mkdir -p $P/logs
          cp -R efi/build/EFI $P/
          cp efi/build/ocvalidate efi/build/macserial $P/
          cp setup/build/SurfaceTouchMac-Setup.pkg $P/
          cp setup/build/SurfaceTouchKeys-Update.pkg setup/build/SurfaceTouchMac-Update.pkg $P/
          cp efi/build/efi-report.txt efi/build/efi-manifest.json $P/logs/
          cp kext/build/xcodebuild.log $P/logs/bigsurface-xcodebuild.log
          cp keyboard/dist/keyboard-ci.log keyboard/dist-tests.log $P/logs/ 2>/dev/null || true
          ( cd $P && find . -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} + | sort -k2 > SHA256SUMS.txt )
          ditto -c -k --keepParent $P SurfaceTouchMac-payload.zip
          shasum -a 256 SurfaceTouchMac-payload.zip | tee SurfaceTouchMac-payload.zip.sha256
      - name: Push CI logs to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs && cd ci-logs
          for f in ../efi/build/efi-report.txt ../efi/build/efi-manifest.json ../kext/build/xcodebuild.log \
                   ../efi/build/bigsurface-compare.txt ../kext/build-itlwm/xcodebuild.log ../kext/build/voodooinput-xcodebuild.log \
                   ../keyboard/dist/keyboard-ci.log ../keyboard/dist-tests.log ../setup/build/distribution.xml; do
            [ -f "$f" ] && cp "$f" . || true
          done
          git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceTouchMac-payload
          path: |
            SurfaceTouchMac-payload.zip
            SurfaceTouchMac-payload.zip.sha256
      - name: Publish payload release (open-source parts only)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG=payload-latest
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" SurfaceTouchMac-payload.zip SurfaceTouchMac-payload.zip.sha256 setup/build/SurfaceTouchKeys-Update.pkg setup/build/SurfaceTouchMac-Update.pkg \
            --title "Payload ${STM_VERSION} (${GITHUB_SHA::7})" --prerelease \
            --notes "Open-source parts only (OpenCore EFI for Surface Pro 7 with SMBIOS placeholders, BigSurface with kernel multitouch, SurfaceTouchKeys, setup package). No Apple software. Not tested on a physical Surface by CI."

# Quick check of setup/common/stm-local-sign on a real Mac (push to branch signtest)
name: signtest
on:
  push:
    branches: [signtest]
permissions:
  contents: write
jobs:
  sign:
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Try local signing variants
        shell: bash
        run: |
          set +e
          exec > >(tee signtest.log) 2>&1
          mkdir -p t/A.app/Contents/MacOS
          printf '#!/bin/sh\necho hi\n' > /dev/null
          cp /usr/bin/true t/A.app/Contents/MacOS/A
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.kaminofilms.surfacetouchkeys" -c "Add :CFBundleExecutable string A" t/A.app/Contents/Info.plist
          codesign --force --sign - t/A.app; ditto t/A.app t/B.app
          D=$RUNNER_TEMP/s
          sed 's#>/dev/null 2>&1 &&#\&\&#; s#"$APP" >/dev/null 2>&1 \&\&#"$APP" \&\&#' setup/common/stm-local-sign > dbg.sh
          echo "== run 1 (stderr visible)"; sudo env STM_SIGN_DIR=$D bash -x dbg.sh t/A.app 2>&1 | tail -40
          echo "== identities"; sudo security find-identity -p codesigning $D/stm-signing.keychain-db
          P=$(sudo cat $D/keychain-password); H=$(sudo security find-identity -p codesigning $D/stm-signing.keychain-db | awk '/Local Signing/{print $2; exit}')
          sudo security unlock-keychain -p "$P" $D/stm-signing.keychain-db
          echo "== variant: plain"; sudo codesign --force --sign "$H" --keychain $D/stm-signing.keychain-db t/B.app; echo rc=$?
          echo "== variant: in search list"; sudo security list-keychains -d user -s $D/stm-signing.keychain-db; sudo codesign --force --sign "$H" t/B.app; echo rc=$?
          echo "== variant: --timestamp=none"; sudo codesign --force --timestamp=none --sign "$H" --keychain $D/stm-signing.keychain-db t/B.app; echo rc=$?
          echo "== variant: non-root user keychain"; cp -R $RUNNER_TEMP/s /tmp/us 2>/dev/null; sudo chown -R $(id -u) /tmp/us; security unlock-keychain -p "$P" /tmp/us/stm-signing.keychain-db; codesign --force --sign "$H" --keychain /tmp/us/stm-signing.keychain-db t/B.app; echo rc=$?
          codesign -d -r- t/B.app
      - name: Push log
        if: always()
        shell: bash
        run: |
          mkdir L && cp signtest.log L/ && cd L && git init -q && git checkout -q -b signtest-logs && git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm log && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signtest-logs

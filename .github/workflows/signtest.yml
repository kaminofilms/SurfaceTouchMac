# Quick check of setup/common/stm-local-sign on a real Mac (push to branch signtest)
name: signtest
on:
  push:
    branches: [signtest]
permissions:
  contents: write
jobs:
  sign:
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Try local signing variants
        shell: bash
        run: |
          set +e
          exec > >(tee signtest.log) 2>&1
          mkdir -p t/A.app/Contents/MacOS
          printf '#!/bin/sh\necho hi\n' > /dev/null
          cp /usr/bin/true t/A.app/Contents/MacOS/A
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.kaminofilms.surfacetouchkeys" -c "Add :CFBundleExecutable string A" t/A.app/Contents/Info.plist
          codesign --force --sign - t/A.app; ditto t/A.app t/B.app
          D=$RUNNER_TEMP/s
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 2" t/B.app/Contents/Info.plist; codesign --force --sign - t/B.app
          echo "== search list before"; sudo security list-keychains -d user
          sudo env STM_SIGN_DIR=$D bash setup/common/stm-local-sign t/A.app
          sudo env STM_SIGN_DIR=$D bash setup/common/stm-local-sign t/B.app
          echo "== search list after"; sudo security list-keychains -d user
          r1="$(codesign -d -r- t/A.app 2>&1 | grep designated)"; echo "A: $r1"; echo "B: $(codesign -d -r- t/B.app 2>&1 | grep designated)"
          codesign --verify --strict -R="${r1#designated => }" t/B.app && echo "CHECK same_identity PASS" || echo "CHECK same_identity FAIL"
          grep -q "certificate leaf" <<<"$r1" && echo "CHECK local_key PASS" || echo "CHECK local_key FAIL"
          t/B.app/Contents/MacOS/A && echo "CHECK runs PASS"
      - name: Push log
        if: always()
        shell: bash
        run: |
          mkdir L && cp signtest.log L/ && cd L && git init -q && git checkout -q -b signtest-logs && git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm log && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signtest-logs
